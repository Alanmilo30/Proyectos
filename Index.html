<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Besito MICH ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #341326 0%, #1a0b14 45%, #080308 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* MENSAJE */
    .message {
      position: absolute;
      left: 50%;
      bottom: 70px;
      transform: translateX(-50%);
      text-align: center;
      opacity: 0;
      animation: showMessage 2s ease 5.2s forwards;
      z-index: 30;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .message h1 {
      font-size: 42px;
      color: #ffd3e8;
      text-shadow:
        0 0 10px rgba(255, 130, 190, 0.6),
        0 0 25px rgba(255, 130, 190, 0.35);
      text-align: center;
      width: 100%;
    }

    .heart {
      display: inline-block;
      animation: heartBeat 1.2s infinite;
    }

    /* TALLO */
    .stem {
      position: absolute;
      left: 50%;
      top: 54%;
      width: 12px;
      height: 250px;
      transform: translateX(-50%);
      border-radius: 20px;
      background: linear-gradient(to right, #15592a, #2ea554, #15592a);
      transform-origin: top;
      animation: growStem 2s ease forwards;
      z-index: 1;
    }

    /* HOJAS */
    .leaf {
      position: absolute;
      width: 95px;
      height: 52px;
      background: linear-gradient(135deg, #1c6d35, #49c96c);
      border-radius: 100% 0 100% 0;
      box-shadow: 0 0 14px rgba(80, 255, 140, 0.15);
      opacity: 0;
      z-index: 2;
    }

    .leaf.left {
      left: calc(50% - 90px);
      top: calc(54% + 120px);
      transform: rotate(-30deg) scale(0.2);
      animation: showLeaf 1.2s ease 2.1s forwards;
    }

    .leaf.right {
      left: calc(50% + 5px);
      top: calc(54% + 155px);
      transform: scaleX(-1) rotate(-30deg) scale(0.2);
      animation: showLeaf 1.2s ease 2.5s forwards;
    }

    /* ROSA */
    .rose {
      position: absolute;
      left: 50%;
      top: 49%;
      width: 280px;
      height: 280px;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    .petal {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: bottom center;
      opacity: 0;
      background: linear-gradient(
        to bottom,
        #ffd7ea 0%,
        #ffb1d4 28%,
        #ff7ab8 55%,
        #f34293 78%,
        #c91466 100%
      );
      box-shadow:
        inset 0 0 18px rgba(255,255,255,0.22),
        0 0 18px rgba(255, 105, 180, 0.18);
    }

    /* CENTRO */
    .p1 {
      width: 56px;
      height: 110px;
      margin-left: -28px;
      margin-top: -90px;
      border-radius: 60% 40% 55% 45%;
      z-index: 20;
      transform: scaleY(0.1) rotate(-8deg);
      animation: p1 1.2s ease 0.2s forwards;
    }

    .p2 {
      width: 56px;
      height: 110px;
      margin-left: -28px;
      margin-top: -90px;
      border-radius: 40% 60% 45% 55%;
      z-index: 21;
      transform: scaleY(0.1) rotate(10deg);
      animation: p2 1.2s ease 0.45s forwards;
    }

    .p3 {
      width: 62px;
      height: 115px;
      margin-left: -31px;
      margin-top: -92px;
      border-radius: 50% 50% 42% 42%;
      z-index: 19;
      transform: scaleY(0.1) rotate(0deg);
      animation: p3 1.3s ease 0.7s forwards;
    }

    /* PÉTALOS INTERIORES */
    .p4 {
      width: 78px;
      height: 125px;
      margin-left: -39px;
      margin-top: -95px;
      border-radius: 58% 42% 48% 52%;
      z-index: 17;
      transform: scale(0.1) rotate(-38deg);
      animation: p4 1.5s ease 1.2s forwards;
    }

    .p5 {
      width: 78px;
      height: 125px;
      margin-left: -39px;
      margin-top: -95px;
      border-radius: 42% 58% 52% 48%;
      z-index: 17;
      transform: scale(0.1) rotate(38deg);
      animation: p5 1.5s ease 1.2s forwards;
    }

    .p6 {
      width: 86px;
      height: 132px;
      margin-left: -43px;
      margin-top: -98px;
      border-radius: 50% 50% 45% 45%;
      z-index: 16;
      transform: scale(0.1) rotate(0deg);
      animation: p6 1.5s ease 1.5s forwards;
    }

    /* PÉTALOS MEDIOS */
    .p7 {
      width: 96px;
      height: 138px;
      margin-left: -48px;
      margin-top: -98px;
      border-radius: 60% 40% 43% 57%;
      z-index: 13;
      transform: scale(0.1) rotate(-68deg);
      animation: p7 1.7s ease 2s forwards;
    }

    .p8 {
      width: 96px;
      height: 138px;
      margin-left: -48px;
      margin-top: -98px;
      border-radius: 40% 60% 57% 43%;
      z-index: 13;
      transform: scale(0.1) rotate(68deg);
      animation: p8 1.7s ease 2s forwards;
    }

    .p9 {
      width: 98px;
      height: 140px;
      margin-left: -49px;
      margin-top: -102px;
      border-radius: 50% 50% 40% 60%;
      z-index: 12;
      transform: scale(0.1) rotate(-118deg);
      animation: p9 1.7s ease 2.3s forwards;
    }

    .p10 {
      width: 98px;
      height: 140px;
      margin-left: -49px;
      margin-top: -102px;
      border-radius: 50% 50% 60% 40%;
      z-index: 12;
      transform: scale(0.1) rotate(118deg);
      animation: p10 1.7s ease 2.3s forwards;
    }

    /* PÉTALOS EXTERNOS */
    .p11 {
      width: 108px;
      height: 148px;
      margin-left: -54px;
      margin-top: -105px;
      border-radius: 58% 42% 40% 60%;
      z-index: 10;
      transform: scale(0.1) rotate(180deg);
      animation: p11 1.8s ease 2.7s forwards;
    }

    .p12 {
      width: 110px;
      height: 145px;
      margin-left: -55px;
      margin-top: -102px;
      border-radius: 60% 40% 44% 56%;
      z-index: 11;
      transform: scale(0.1) rotate(-88deg);
      animation: p12 1.8s ease 2.9s forwards;
    }

    .p13 {
      width: 110px;
      height: 145px;
      margin-left: -55px;
      margin-top: -102px;
      border-radius: 40% 60% 56% 44%;
      z-index: 11;
      transform: scale(0.1) rotate(88deg);
      animation: p13 1.8s ease 2.9s forwards;
    }

    /* BRILLOS */
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px #fff, 0 0 18px #ff80bf;
      opacity: 0;
      animation: floatSparkle linear forwards;
      z-index: 25;
    }

    /* ANIMACIONES */
    @keyframes growStem {
      from { height: 0; }
      to { height: 250px; }
    }

    @keyframes showLeaf {
      from { opacity: 0; }
      to { opacity: 1; transform: rotate(-30deg) scale(1); }
    }

    @keyframes p1 {
      to { opacity: 1; transform: scaleY(1) rotate(-8deg) translateY(-2px); }
    }

    @keyframes p2 {
      to { opacity: 1; transform: scaleY(1) rotate(10deg) translateX(-3px); }
    }

    @keyframes p3 {
      to { opacity: 1; transform: scaleY(1) rotate(0deg) translateY(8px); }
    }

    @keyframes p4 {
      to { opacity: 1; transform: scale(1) rotate(-38deg) translateX(-24px) translateY(10px); }
    }

    @keyframes p5 {
      to { opacity: 1; transform: scale(1) rotate(38deg) translateX(24px) translateY(10px); }
    }

    @keyframes p6 {
      to { opacity: 1; transform: scale(1) rotate(0deg) translateY(18px); }
    }

    @keyframes p7 {
      to { opacity: 1; transform: scale(1) rotate(-68deg) translateX(-38px) translateY(28px); }
    }

    @keyframes p8 {
      to { opacity: 1; transform: scale(1) rotate(68deg) translateX(38px) translateY(28px); }
    }

    @keyframes p9 {
      to { opacity: 1; transform: scale(1) rotate(-118deg) translateX(-20px) translateY(42px); }
    }

    @keyframes p10 {
      to { opacity: 1; transform: scale(1) rotate(118deg) translateX(20px) translateY(42px); }
    }

    @keyframes p11 {
      to { opacity: 1; transform: scale(1) rotate(180deg) translateY(48px); }
    }

    @keyframes p12 {
      to { opacity: 1; transform: scale(1) rotate(-88deg) translateX(-12px) translateY(36px); }
    }

    @keyframes p13 {
      to { opacity: 1; transform: scale(1) rotate(88deg) translateX(12px) translateY(36px); }
    }

    @keyframes showMessage {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes floatSparkle {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0);
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-170px) scale(1.4);
      }
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }

    @media (max-width: 700px) {
      .rose {
        transform: translate(-50%, -50%) scale(0.82);
      }

      .message h1 {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">

    <div class="rose">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p6"></div>
      <div class="petal p7"></div>
      <div class="petal p8"></div>
      <div class="petal p9"></div>
      <div class="petal p10"></div>
      <div class="petal p11"></div>
      <div class="petal p12"></div>
      <div class="petal p13"></div>
    </div>

    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>

    <div class="message">
      <h1>Besito MICH <span class="heart">❤️</span></h1>
    </div>

  </div>

  <script>
    const scene = document.getElementById("scene");

    function crearBrillo() {
      const s = document.createElement("div");
      s.classList.add("sparkle");

      s.style.left = (Math.random() * 38 + 31) + "%";
      s.style.top = (Math.random() * 26 + 22) + "%";
      s.style.animationDuration = (3 + Math.random() * 2) + "s";

      scene.appendChild(s);

      setTimeout(() => {
        s.remove();
      }, 5000);
    }

    setInterval(crearBrillo, 350);
  </script>
</body>
</html>
